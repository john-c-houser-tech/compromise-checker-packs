remediation:
- 'Update ca-certificates now to the fixed build from your vendor, which distrusts the compromised
  eMudhra certificates: RHEL 9 RHSA-2026:88459, RHEL 10 RHSA-2026:88455, or the Rocky Linux
  and AlmaLinux rebuilds of them. On Ubuntu, 20260816ubuntu0.XX.1 or later (from 2026-10-20).
  If Java or Mono programs on the host rely on their own certificate stores, take .2 (2026-11-05),
  which also updates those stores.'
- 'If you can''t update yet, add the two root CAs that signed the compromised intermediates
  to the system trust store''s blocklist: Comodo AAA Services root and emSign ECC Root CA
  - G3. Follow the ''Red Hat Enterprise Linux and Fedora'' mitigation steps linked from RHSB-2026-012.'
- Rebuild every container based on RHEL or UBI images once the base images are updated, and
  check the Container Health Index in the Red Hat Container Catalog for Red Hat's own product
  images.
- On hosts running layered products that pull packages from the RHEL channel, such as OpenShift,
  OpenStack or Red Hat Virtualization, make sure the underlying RHEL CA trust store package
  is current. OpenShift and Agent-based Installer environments have their own mitigation steps
  in the bulletin.
- Go programs, Java and Perl's Mozilla::CA carry their own trust stores, tracked separately
  (CVE-2026-111943, CVE-2026-91403, CVE-2026-113812). Update them as well if this host's TLS
  clients rely on them.
