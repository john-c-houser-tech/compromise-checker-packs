      source: https://blog.remirepo.net/post/2026/10/22/PHP-version-8.2.35-8.3.36-8.4.27-8.5.12
    # PHP 8.6 pre-releases: no release candidate is known to carry the fix.
    - release: "ubuntu:22.04"
      binary_names: [php8.6-fpm, libapache2-mod-php8.6, php8.6-cgi, php8.6-litespeed]
      versions: "8.6.0~*"
      fixed: null
      source: https://launchpad.net/~ondrej/+archive/ubuntu/php
    - release: "ubuntu:24.04"
      binary_names: [php8.6-fpm, libapache2-mod-php8.6, php8.6-cgi, php8.6-litespeed]
      versions: "8.6.0~*"
      fixed: null
      source: https://launchpad.net/~ondrej/+archive/ubuntu/php
    - release: "rhel:9"
      binary_names: [php, php-fpm, php-cli, php-litespeed, php86-php, php86-php-fpm, php86-php-cli, php86-php-litespeed]
      versions: "8.6.0~*"
      fixed: null
      source: https://rpms.remirepo.net/enterprise/9/modular/x86_64/
    - release: "rhel:10"
      binary_names: [php, php-fpm, php-cli, php-litespeed, php86-php, php86-php-fpm, php86-php-cli, php86-php-litespeed]
      versions: "8.6.0~*"
      fixed: null
      source: https://rpms.remirepo.net/enterprise/10/modular/x86_64/
  stale_code: {programs: ["php-fpm*", "php-cgi*", "lsphp*"]}
mitigations:
  - id: upload-progress-off
    setting: {kind: php_ini, name: session.upload_progress.enabled}
    expect: "off"
    default: "on"
    covers: [CVE-2026-115560]
    text: >-
      Turn off upload progress tracking (session.upload_progress.enabled = 0, with
      php_admin_flag in each PHP-FPM pool) and restart every worker. It blocks the
      session upload progress route to CVE-2026-109619, not the other routes (on PHP
      8.5 also set fatal_error_backtraces=0), and does nothing for CVE-2026-109618: it
      doesn't replace the fixed package. PHP suggests keeping it off until its next
      regular release fixes CVE-2026-115560, unless the application never changes
      session.serialize_handler at runtime. PHP warns not to rely on ini_set() or an
      FPM .user.ini for this.
detections:
  - id: worker-child
    check: web.worker_child
    likelihood_ratio: 100
  - id: new-script-hit
    check: web.new_script_hit
    likelihood_ratio: 50
  - id: server-errors
    check: web.errors
    counts: while_exposed
    likelihood_ratio: 4
  - id: php-crash
    title: PHP workers crashing
    counts: while_exposed
    events:
      any_of:
        - type: web.error
          fields: {message: {glob: "*child * exited on signal 11*"}}
        - type: web.error
          fields: {message: {glob: "*child * exited on signal 6*"}}
        - type: web.error
          fields: {message: {glob: "*child * exited on signal 7*"}}
        - type: web.error
          fields: {message: {glob: "*exit signal Segmentation fault*"}}
        - type: kernel.segfault
          fields: {comm: {prefix: php-fpm}}
      # One crash can log two lines, here and in the kernel's.
      count: {at_least: 6, within: 10m}
    likelihood_ratio: 8
  - id: memory-limit-burst
    title: A burst of PHP memory-limit errors
    counts: while_exposed
    events:
      any_of:
        - type: web.error
          fields: {message: {glob: "*Allowed memory size of * bytes exhausted*"}}
      count: {at_least: 30, within: 10m}
    likelihood_ratio: 3
remediation:
  - >-
    Upgrade PHP to a fixed package and restart every PHP worker, and Apache where it
    runs mod_php: this pack can't detect an Apache left running on the old module.
  - >-
    If the host was exposed during the window, treat secrets the PHP process could
    read as possibly disclosed: rotate application keys, database passwords, API
    keys and TLS private keys, and invalidate sessions.
  - >-
    Check PHP this pack doesn't list: cPanel's and Plesk's own packages, and software
    that bundles its own PHP. Ubuntu 20.04 and older (USN-8948-2) and RHEL 8 have vendor
    fixes this version of the pack doesn't judge.
