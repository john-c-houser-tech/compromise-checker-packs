remediation:
- Update the system Brotli library to the fixed package from your distribution's advisory
  (Ubuntu's USNs or Red Hat's errata).
- After updating, restart every service that loaded the Brotli library, or reboot. Running
  processes keep the old, vulnerable copy in memory until they restart. Examples are web servers,
  Node.js applications and .NET applications.
- Red Hat says some Node.js and .NET builds on Red Hat Enterprise Linux carry their own bundled
  copy of Brotli instead of the system library. Update those runtimes to their fixed packages
  too.
- 'Check for applications, language packages and container images that bundle their own copy
  of Brotli, and update each one. Updating the system library does not fix a bundled copy.
  This pack doesn''t judge .NET on Ubuntu: update its .NET runtimes from Ubuntu''s own advisory.'
- There is no configuration setting the sources offer as a workaround. Until you can patch,
  reduce exposure where you can by not decompressing Brotli data from untrusted sources. Red
  Hat names HTTP content sent with Brotli encoding and Node.js decompression or fetch calls
  as typical paths.
- 'CISA lists this flaw as exploited in the wild. If the host ran a vulnerable build while
  it handled untrusted input, review it for signs of compromise: unexpected crashes of network
  services, shells or tools started by web or application workers, and new accounts, keys
  or persistence.'
