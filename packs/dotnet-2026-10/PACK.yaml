remediation:
- Install the .NET security update from your distribution. Ubuntu says a standard system update
  makes all the necessary changes; on RHEL, apply Red Hat's .NET update for your .NET version
  (RHSA-2026:86168, 86169, 86171, 86172, 86193 or 86195).
- After updating, restart every service that runs an ASP.NET Core application, so that none
  keeps running on the old runtime.
- Neither Red Hat nor Ubuntu offers a workaround that meets its own criteria, so patching
  is the fix. Red Hat says only Kestrel endpoints handling HTTP/2 are exposed to CVE-2026-70188,
  so turning off HTTP/2 on public-facing Kestrel endpoints may reduce that one exposure until
  you can patch. This does not help against CVE-2026-88092, which affects HTTP/1 handling.
- If an exposed application was reachable from the internet while it ran a vulnerable build,
  check its own logs for requests that reached protected or administrative functions without
  proper authorization. Red Hat names credential exposure as a possible impact, so rotate
  any credentials or session secrets those applications handled.
